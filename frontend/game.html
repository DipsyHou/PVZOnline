<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PVZ Online</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        body { justify-content: flex-start; padding-top: 20px; }
        .plant-card {
            display: inline-block;
            width: 100px;
            height: 60px;
            background-color: #ccc;
            margin-right: 10px;
            position: relative;
            cursor: pointer;
            border: 2px solid transparent;
            text-align: center;
            line-height: 60px;
            font-size: 12px;
            user-select: none;
        }
        .plant-card.selected {
            border-color: white;
        }
        .cooldown-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 0%;
            background-color: rgba(0, 0, 0, 0.5);
            transition: height 0.1s linear;
        }
    </style>
</head>
<body>
    <div style="margin-bottom: 10px; display: flex; align-items: center;">
        <button onclick="backToLobby()" style="width:auto; padding: 5px 10px; font-size: 12px;">退出游戏</button>
        <span id="game-info" style="color: white; margin-left: 10px;"></span>
        <span id="sun-display" style="color: yellow; font-weight: bold; margin-left: 20px; font-size: 18px; display: none;">阳光: 50</span>
    </div>
    <div id="plant-controls" style="margin-bottom: 10px; display: none;">
        <div class="plant-card" onclick="selectPlant('peashooter')" id="btn-peashooter" style="background-color: #2ecc71;">
            豌豆 (100)
            <div class="cooldown-overlay"></div>
        </div>
        <div class="plant-card" onclick="selectPlant('sunflower')" id="btn-sunflower" style="background-color: #f1c40f;">
            向日葵 (50)
            <div class="cooldown-overlay"></div>
        </div>
        <div class="plant-card" onclick="selectPlant('pod_peashooter')" id="btn-pod_peashooter" style="background-color: #27ae60;">
            豆荚 (225)
            <div class="cooldown-overlay"></div>
        </div>
    </div>
    <canvas id="gameCanvas"></canvas>
    <script src="js/game.js"></script>
</body>
</html>
