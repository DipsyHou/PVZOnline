<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>PVZ Online</title>
    <link rel="stylesheet" href="css/pvz.css">
</head>
<body>
    <div id="ui">
        <div id="topbar">
            <button onclick="backToLobby()" style="padding:6px 8px;background:#e74c3c;color:#fff;border:none;border-radius:4px;cursor:pointer;font-weight:bold;">退出</button>
            
            <!-- Plant UI -->
            <div id="sun" style="display:none">Sun: <span id="sun-count">50</span></div>
            <div id="plant-slot-bar" style="display:none; flex-wrap: wrap; max-width: 800px;">
                <!-- Cards will be generated by JS -->
            </div>

            <!-- Zombie UI -->
            <div id="brains" style="display:none; font-weight:700;padding:6px 10px;background:#e6b0aa;border-radius:6px;border:1px solid #c0392b;">Brains: <span id="brains-count">50</span></div>
            <div id="zombie-slot-bar" style="display:none; gap:6px;padding:4px 6px;background:#d7bde2;border-radius:6px;border:1px solid #8e44ad; flex-wrap: wrap; max-width: 800px;">
                <!-- Cards will be generated by JS -->
            </div>

            <div id="role-display" style="margin-left:auto; font-weight:bold; color:#333; font-size:14px;"></div>
        </div>
    </div>

    <canvas id="game" width="1100" height="700"></canvas>

    <script type="module" src="js/game.js"></script>
</body>
</html>
