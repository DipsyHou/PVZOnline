<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PVZ Online - 房间准备</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <h2 id="room-title">房间 #ID</h2>
        <div id="rename-container" style="display:none; margin-bottom: 10px;">
            <input type="text" id="room-name-input" placeholder="新房间名">
            <button onclick="renameRoom()">修改名称</button>
        </div>
        <div id="player-list">
            <!-- 玩家列表 -->
        </div>
        
        <!-- Deck Selection Button -->
        <button onclick="openDeckModal()" style="margin: 15px 0; background-color: #8e44ad; width: 100%;">编辑卡组</button>

        <!-- Deck Selection Modal -->
        <div id="deck-modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:1000; align-items:center; justify-content:center;">
            <div style="background:#2c3e50; padding:20px; border-radius:10px; width:90%; max-width:600px; max-height:90vh; overflow-y:auto; position:relative; border: 1px solid #34495e; box-shadow: 0 4px 15px rgba(0,0,0,0.5);">
                <span onclick="closeDeckModal()" style="position:absolute; top:10px; right:15px; font-size:28px; cursor:pointer; color: #ecf0f1;">&times;</span>
                <h3 style="margin-top:0; color: #ecf0f1; text-align: center; border-bottom: 1px solid #34495e; padding-bottom: 10px;">配置卡组</h3>
                
                <h4 style="color: #2ecc71; margin: 10px 0;">植物卡牌</h4>
                <div id="deck-plants" class="card-grid" style="display:flex; flex-wrap:wrap; gap:8px; justify-content:center; background: rgba(0,0,0,0.2); padding: 10px; border-radius: 5px;"></div>
                
                <h4 style="color: #e74c3c; margin: 10px 0;">僵尸卡牌</h4>
                <div id="deck-zombies" class="card-grid" style="display:flex; flex-wrap:wrap; gap:8px; justify-content:center; background: rgba(0,0,0,0.2); padding: 10px; border-radius: 5px;"></div>
                
                <button onclick="confirmDeck()" style="margin-top:20px; width:100%; background-color:#27ae60; font-size: 1.1em; padding: 10px;">保存并关闭</button>
            </div>
        </div>

        <div class="settings">
            <label>模式: 
                <select id="game-mode">
                    <option value="pve">标准对战</option>
                    <option value="endless">无尽模式</option>
                </select>
            </label>
            <br>
            <label>关卡: 
                <select id="game-level">
                    <option value="1">Level 1</option>
                    <option value="2">Level 2</option>
                </select>
            </label>
            <br>
            <label>帧率上限: 
                <select id="game-tps">
                    <option value="30">30</option>
                    <option value="60">60</option>
                    <option value="120">120</option>
                </select>
            </label>
        </div>

        <button onclick="startGame()" id="start-btn" disabled>开始游戏</button>
        <button onclick="leaveRoom()" style="background-color:#c0392b">离开房间</button>
    </div>
    <script type="module" src="js/room.js"></script>
</body>
</html>
